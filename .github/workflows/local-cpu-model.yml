name: Real local CPU model acceptance
on:
  pull_request:
    paths:
      - 'tools/local-model-e2e.mjs'
      - 'src/codex.mjs'
      - 'src/game-tools.mjs'
      - 'src/world.mjs'
      - 'src/server.mjs'
      - '.github/workflows/local-cpu-model.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-cpu-model-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-local-model:
    # Standard public-repository runner only, never a larger or paid label.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download verified official CPU runtime, model and Codex
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tus-cpu"
          cd "$RUNNER_TEMP/tus-cpu"
          curl --fail --location --connect-timeout 20 --max-time 120 --max-filesize 125000000 \
            https://github.com/openai/codex/releases/download/rust-v0.167.0/codex-x86_64-unknown-linux-musl.tar.gz -o codex.tar.gz
          echo '9d64836106d5b374e90ee4454c7ebcde7ca7106558bd7e41a34b9f26ebda251a  codex.tar.gz' | sha256sum --check --strict
          curl --fail --location --connect-timeout 20 --max-time 120 --max-filesize 25000000 \
            https://github.com/ggml-org/llama.cpp/releases/download/b12189/llama-b12189-bin-ubuntu-x64.tar.gz -o llama.tar.gz
          echo 'c446a7ba4df3c3b1cc880a734fbff586d6d34b9cebc09e151754813b94ded8c9  llama.tar.gz' | sha256sum --check --strict
          curl --fail --location --connect-timeout 20 --max-time 180 --max-filesize 530000000 \
            https://registry.ollama.ai/v2/library/qwen3/blobs/sha256:7f4030143c1c477224c5434f8272c662a8b042079a0a584f0a27a1684fe2e1fa -o qwen3-0.6b.gguf
          echo '7f4030143c1c477224c5434f8272c662a8b042079a0a584f0a27a1684fe2e1fa  qwen3-0.6b.gguf' | sha256sum --check --strict
          tar -xf codex.tar.gz
          tar -xf llama.tar.gz
          ./codex-x86_64-unknown-linux-musl --version
          ./llama-b12189/llama-server --version
      - name: Run genuine CPU-model to game-world acceptance
        env:
          TUS_TEST_CODEX: ${{ runner.temp }}/tus-cpu/codex-x86_64-unknown-linux-musl
          TUS_TEST_LLAMA: ${{ runner.temp }}/tus-cpu/llama-b12189/llama-server
          TUS_TEST_GGUF: ${{ runner.temp }}/tus-cpu/qwen3-0.6b.gguf
          TUS_TEST_REPORT: ${{ runner.temp }}/tus-cpu/report.json
          TUS_TEST_TIMEOUT_MS: '300000'
        run: node tools/local-model-e2e.mjs
      - name: Include evidence in run summary without artifact storage
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/tus-cpu/report.json"; then
            printf '## Real local CPU-model result\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/tus-cpu/report.json" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No inference report was produced. Inspect the failed setup step; this is not a passing model test.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
