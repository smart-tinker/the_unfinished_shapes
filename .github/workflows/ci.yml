name: Validate
on:
  pull_request:
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: xvfb-run --auto-servernum node scripts/electron-smoke.mjs
  macos-native:
    if: github.event.repository.private == false
    # Standard public runner: Apple Silicon, not a paid -large/-xlarge label.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - name: Verify native macOS arm64 runner
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64') throw Error('Expected native macOS arm64'); console.log(process.platform,process.arch)"
      - run: npm ci
      - run: npm run check
      - run: node scripts/electron-smoke.mjs
      - run: node scripts/package-macos.mjs
      - name: Launch the native packaged application
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-darwin-arm64/TheUnfinishedShapes.app/Contents/MacOS/TheUnfinishedShapes
        run: |
          test "$(lipo -archs "$TUS_SMOKE_EXECUTABLE")" = arm64
          node scripts/electron-smoke.mjs
  windows-installer:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - run: npm run installer:win
      - name: Verify clean install, current-candidate lifecycle and retained data
        run: node scripts/windows-installer-smoke.mjs
