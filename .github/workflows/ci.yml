name: Validate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
  linux-client:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run package:linux
      - name: Packaged client lifecycle
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-linux-x64/TheUnfinishedShapes
        run: xvfb-run --auto-servernum node scripts/electron-smoke.mjs
      - name: Two packaged clients and a shared server
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-linux-x64/TheUnfinishedShapes
        run: xvfb-run --auto-servernum node scripts/shared-world-smoke.mjs
      - name: Bounded packaged-world performance
        env:
          TUS_BENCHMARK: '1'
          TUS_BENCHMARK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-linux-x64/TheUnfinishedShapes
        run: xvfb-run --auto-servernum node scripts/performance-benchmark.mjs
  model:
    needs: test
    uses: ./.github/workflows/local-cpu-model.yml
    permissions:
      contents: read
  macos-native:
    needs: test
    if: github.event.repository.private == false
    # Standard public runner: Apple Silicon, not a paid -large/-xlarge label.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - name: Verify native macOS arm64 runner
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64') throw Error('Expected native macOS arm64'); console.log(process.platform,process.arch)"
      - run: npm ci
      - run: npm run check
      - run: node scripts/package-macos.mjs
      - name: Launch the native packaged application
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-darwin-arm64/TheUnfinishedShapes.app/Contents/MacOS/TheUnfinishedShapes
        run: |
          test "$(lipo -archs "$TUS_SMOKE_EXECUTABLE")" = arm64
          node scripts/electron-smoke.mjs
  windows-installer:
    needs: test
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse Windows UI automation script
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('scripts/windows-quit-prompt.ps1', [ref]$tokens, [ref]$errors) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - run: npm run installer:win
      - name: Verify clean install, current-candidate lifecycle and retained data
        env:
          TUS_SMOKE_PORTABLE_EXECUTABLE: dist/TheUnfinishedShapes-win32-x64/TheUnfinishedShapes.exe
        run: node scripts/windows-installer-smoke.mjs
