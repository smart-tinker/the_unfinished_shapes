name: Validate
on:
  pull_request:
  push:
    branches: [main, 'release/**', 'publish/0.1.0-rc3']
  workflow_dispatch:
    inputs:
      publish_rc:
        description: Publish this accepted RC commit after validation
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  # Serialize the whole publication chain across both explicit entry routes.
  group: ${{ ((github.event_name == 'workflow_dispatch' && inputs.publish_rc == true && github.ref == 'refs/heads/release/0.1.0-rc3') || (github.event_name == 'push' && github.ref == 'refs/heads/publish/0.1.0-rc3')) && 'publish-0.1.0-rc3' || format('validate-{0}', github.ref) }}
  cancel-in-progress: ${{ !((github.event_name == 'workflow_dispatch' && inputs.publish_rc == true && github.ref == 'refs/heads/release/0.1.0-rc3') || (github.event_name == 'push' && github.ref == 'refs/heads/publish/0.1.0-rc3')) }}
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: xvfb-run --auto-servernum node scripts/electron-smoke.mjs
  macos-native:
    if: github.event.repository.private == false
    # Standard public runner: Apple Silicon, not a paid -large/-xlarge label.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - name: Verify native macOS arm64 runner
        run: |
          sw_vers
          test "$(uname -m)" = arm64
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64') throw Error('Expected native macOS arm64'); console.log(process.platform,process.arch)"
      - run: npm ci
      - run: npm run check
      - run: node scripts/electron-smoke.mjs
      - run: node scripts/package-macos.mjs
      - name: Launch the native packaged application
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-darwin-arm64/TheUnfinishedShapes.app/Contents/MacOS/TheUnfinishedShapes
        run: |
          test "$(lipo -archs "$TUS_SMOKE_EXECUTABLE")" = arm64
          node scripts/electron-smoke.mjs
  windows-installer:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm run package:win
      - run: npm run installer:win
      - name: Verify clean install, RC1 migration, installed runtime and retained data
        run: node scripts/windows-installer-smoke.mjs
  release-windows:
    if: github.event.repository.private == false && ((github.event_name == 'workflow_dispatch' && inputs.publish_rc == true && github.ref == 'refs/heads/release/0.1.0-rc3') || (github.event_name == 'push' && github.ref == 'refs/heads/publish/0.1.0-rc3'))
    needs: [test, windows-installer, macos-native]
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require the current accepted RC head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/0.1.0-rc3" > rc-ref.json
          node -e "const r=require('./rc-ref.json'); if(r.ref!=='refs/heads/release/0.1.0-rc3' || r.object?.type!=='commit' || r.object.sha!==process.env.GITHUB_SHA) throw Error('Publication must use the exact current RC head')"
          rm rc-ref.json
      - name: Require real CPU-model acceptance for this exact commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" > model-runs.json
          node -e "const r=require('./model-runs.json').workflow_runs; if(!r.some(x=>x.path==='.github/workflows/local-cpu-model.yml' && x.event==='push' && x.head_branch==='release/0.1.0-rc3' && x.head_sha===process.env.GITHUB_SHA && x.status==='completed' && x.conclusion==='success')) throw Error('No successful real CPU-model acceptance for this exact commit')"
          rm model-runs.json
      - name: Check immutable release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "if(!/^\d+\.\d+\.\d+-rc\.\d+$/.test(require('./package.json').version)) throw Error('Only explicit release-candidate versions may publish here')"
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION/-rc./-rc}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/verify-release-tag.mjs "$TAG" --allow-missing
          if gh release view "$TAG" --json isDraft,targetCommitish > release-state.json 2>/dev/null; then
            node scripts/verify-release-tag.mjs "$TAG"
            if [ "$(node -p "require('./release-state.json').isDraft")" = false ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "Release $TAG already published. Its files will not be overwritten; bump the version for a new release."
              exit 0
            fi
            node -e "if(require('./release-state.json').targetCommitish!==process.env.GITHUB_SHA) throw Error('Existing draft belongs to another commit; refusing to replace it')"
          fi
          rm -f release-state.json
          echo "published=false" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.published == 'false'
        run: npm ci
      - if: steps.version.outputs.published == 'false'
        run: npm run package:win
      - if: steps.version.outputs.published == 'false'
        run: npm run installer:win
      - name: Test the exact installer that will be uploaded
        if: steps.version.outputs.published == 'false'
        run: node scripts/windows-installer-smoke.mjs
      - name: Archive and hash Windows files
        if: steps.version.outputs.published == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Compress-Archive -Path dist/TheUnfinishedShapes-win32-x64 -DestinationPath "dist/TheUnfinishedShapes-$env:VERSION-win32-x64.zip" -Force
          Copy-Item dist/installer/*.exe dist/
          $lines = Get-ChildItem dist/*.zip,dist/*.exe | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist/SHA256SUMS-windows -Encoding utf8NoBOM
      - name: Stage tested Windows files in a private draft
        if: steps.version.outputs.published == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/verify-release-tag.mjs "$TAG" --allow-missing
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            node scripts/verify-release-tag.mjs "$TAG" --create-missing
            gh release create "$TAG" --target "$GITHUB_SHA" --title "The Unfinished Shapes ${VERSION}" --draft --prerelease --notes-file docs/RELEASE-0.1-rc3.md
          fi
          node scripts/verify-release-tag.mjs "$TAG"
          gh release view "$TAG" --json isDraft,targetCommitish > release-state.json
          node -e "const r=require('./release-state.json'); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) throw Error('Refusing to overwrite a published release or a draft for another commit')"
          gh release upload "$TAG" dist/*.zip dist/*.exe dist/SHA256SUMS-windows --clobber
  release-macos:
    needs: release-windows
    if: needs.release-windows.outputs.published == 'false'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: arm64
      - name: Verify native macOS arm64 runner
        run: |
          test "$(uname -m)" = arm64
          node -e "if(process.platform!=='darwin'||process.arch!=='arm64') throw Error('Expected native macOS arm64')"
      - run: npm ci
      - run: node scripts/package-macos.mjs
      - name: Test the exact native app that will be uploaded
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-darwin-arm64/TheUnfinishedShapes.app/Contents/MacOS/TheUnfinishedShapes
        run: |
          test "$(lipo -archs "$TUS_SMOKE_EXECUTABLE")" = arm64
          node scripts/electron-smoke.mjs
      - name: Stage tested macOS arm64 package in the matching draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-windows.outputs.tag }}
          VERSION: ${{ needs.release-windows.outputs.version }}
        run: |
          node scripts/verify-release-tag.mjs "$TAG"
          gh release view "$TAG" --json isDraft,targetCommitish > release-state.json
          node -e "const r=require('./release-state.json'); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) throw Error('Refusing to overwrite a published release or a draft for another commit')"
          ditto -c -k --sequesterRsrc --keepParent dist/TheUnfinishedShapes-darwin-arm64/TheUnfinishedShapes.app "dist/TheUnfinishedShapes-${VERSION}-darwin-arm64.zip"
          node scripts/verify-release-tag.mjs "$TAG"
          gh release upload "$TAG" "dist/TheUnfinishedShapes-${VERSION}-darwin-arm64.zip" --clobber
  release:
    needs: [release-windows, release-macos]
    if: needs.release-windows.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run package:linux
      - name: Test the exact Linux package that will be uploaded
        env:
          TUS_SMOKE_EXECUTABLE: dist/TheUnfinishedShapes-linux-x64/TheUnfinishedShapes
        run: xvfb-run --auto-servernum node scripts/electron-smoke.mjs
      - name: Complete and publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-windows.outputs.tag }}
          VERSION: ${{ needs.release-windows.outputs.version }}
        run: |
          node scripts/verify-release-tag.mjs "$TAG"
          gh release view "$TAG" --json isDraft,targetCommitish,assets > release-state.json
          node -e "const r=require('./release-state.json'); if(!r.isDraft || r.targetCommitish!==process.env.GITHUB_SHA) throw Error('Draft does not match this tested commit')"
          node -e "const r=require('./release-state.json'); for(const name of ['TheUnfinishedShapes-'+process.env.VERSION+'-win32-x64.zip','TheUnfinishedShapes-'+process.env.VERSION+'-Setup-x64.exe','TheUnfinishedShapes-'+process.env.VERSION+'-darwin-arm64.zip']) { const a=r.assets.filter(x=>x.name===name); if(a.length!==1 || a[0].size<1 || a[0].size>536870912) throw Error('Missing, duplicate or oversized expected asset: '+name); }"
          cd dist
          tar -czf "TheUnfinishedShapes-${VERSION}-linux-x64.tar.gz" TheUnfinishedShapes-linux-x64
          gh release download "$TAG" --pattern "TheUnfinishedShapes-${VERSION}-win32-x64.zip" --pattern "TheUnfinishedShapes-${VERSION}-Setup-x64.exe" --pattern "TheUnfinishedShapes-${VERSION}-darwin-arm64.zip" --dir .
          sha256sum "TheUnfinishedShapes-${VERSION}-win32-x64.zip" "TheUnfinishedShapes-${VERSION}-Setup-x64.exe" "TheUnfinishedShapes-${VERSION}-darwin-arm64.zip" *.tar.gz > SHA256SUMS
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          node ../scripts/verify-release-tag.mjs "$TAG"
          gh release upload "$TAG" *.tar.gz SHA256SUMS --clobber
          node ../scripts/verify-release-tag.mjs "$TAG"
          gh release edit "$TAG" --draft=false --prerelease
