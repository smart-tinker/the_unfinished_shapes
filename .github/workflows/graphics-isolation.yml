name: Linux graphics isolation
on:
  pull_request:
    paths:
      - 'scripts/webgl-probe.mjs'
      - '.github/workflows/graphics-isolation.yml'
permissions:
  contents: read
concurrency:
  group: graphics-isolation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    if: github.event.repository.private == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, mode: swiftshader }
          - { os: ubuntu-22.04, mode: mesa }
          - { os: ubuntu-22.04, mode: default }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: xvfb-run --auto-servernum node scripts/webgl-probe.mjs ${{ matrix.mode }}
