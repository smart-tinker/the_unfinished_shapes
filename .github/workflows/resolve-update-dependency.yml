name: Resolve updater dependency lock
on:
  pull_request:
jobs:
  resolve:
    if: github.event.pull_request.number == 87
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve Sigstore lock entries without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund sigstore@4.1.0
      - name: Emit lock delta for review
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const changed = Object.fromEntries(Object.entries(after.packages).filter(([key, value]) => JSON.stringify(before.packages[key]) !== JSON.stringify(value)));
          const removed = Object.keys(before.packages).filter(key => !Object.hasOwn(after.packages, key));
          const encoded = Buffer.from(JSON.stringify({ lockfileVersion: after.lockfileVersion, root: after.packages[''], changed, removed })).toString('base64');
          for (let start = 0, index = 0; start < encoded.length; start += 1200, index++) console.log('LOCKDELTA' + index + ':' + encoded.slice(start, start + 1200));
          console.log('LOCKCOUNT:' + Object.keys(changed).length);
          NODE
